services:
  postgres:
    image: postgres:17
    container_name: grocery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_password
      POSTGRES_DB: grocery_db
    ports:
      - '5432:5432'
    volumes:
      - grocery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U grocery_user -d grocery_db',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:17
    container_name: grocery-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: grocery_test_user
      POSTGRES_PASSWORD: grocery_test_password
      POSTGRES_DB: grocery_test_db
    ports:
      - '5433:5432'
    volumes:
      - grocery_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U grocery_test_user -d grocery_test_db',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocery_postgres_data:
  grocery_postgres_test_data: